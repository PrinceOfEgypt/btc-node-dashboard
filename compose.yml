services:
  btc-node-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc-node-dashboard
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      QUARKUS_HTTP_HOST: "${QUARKUS_HTTP_HOST:-0.0.0.0}"
      QUARKUS_HTTP_PORT: "${QUARKUS_HTTP_PORT:-8081}"
      BITCOIN_RPC_HOST: "${BITCOIN_RPC_HOST:-127.0.0.1}"
      BITCOIN_RPC_PORT: "${BITCOIN_RPC_PORT:-8332}"
      BITCOIN_RPC_USER: "${BITCOIN_RPC_USER:?set BITCOIN_RPC_USER in .env}"
      BITCOIN_RPC_PASSWORD: "${BITCOIN_RPC_PASSWORD:?set BITCOIN_RPC_PASSWORD in .env}"
      BITCOIN_RPC_SCHEME: "${BITCOIN_RPC_SCHEME:-http}"
      WS_POLLING_INTERVAL: "${WS_POLLING_INTERVAL:-5}"
      MIN_OUTBOUND_PEERS: "${MIN_OUTBOUND_PEERS:-8}"
      DASHBOARD_CACHE_VALIDITY_BUFFER_MS: "${DASHBOARD_CACHE_VALIDITY_BUFFER_MS:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: always
